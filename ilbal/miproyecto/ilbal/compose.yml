services:
  postgresql:
    image: ilbal-postgresql:18
    pull_policy: missing
    container_name: miproyecto-postgresql
    hostname: miproyecto-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: duck
      POSTGRES_PASSWORD: quack
      POSTGRES_DB: app
    ports:
      - "33330:5432"
    command: ["postgres", "-c", "config_file=/postgres/postgresql.conf"]
    volumes:
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/postgres/postgresql.conf:ro
    networks:
      - miproyecto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sequin"]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 2s
      start_interval: 1s

  pgadmin4:
    image: docker.io/dpage/pgadmin4:latest
    pull_policy: missing
    container_name: miproyecto-pgadmin4
    hostname: miproyecto-pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: duck@duck.com
      PGADMIN_DEFAULT_PASSWORD: quack
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "33331:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin4/servers.json:/pgadmin4/servers.json
      - ./pgadmin4/pgpass:/pgadmin4/pgpass
    networks:
      - miproyecto
    depends_on:
      postgresql:
        condition: service_healthy

  pgdog:
    image: ghcr.io/pgdogdev/pgdog:latest
    pull_policy: missing
    container_name: miproyecto-pgdog
    hostname: miproyecto-pgdog
    restart: unless-stopped
    ports:
      - "33332:6432"
    volumes:
      - ./pgdog/pgdog.toml:/pgdog/pgdog.toml
      - ./pgdog/users.toml:/pgdog/users.toml
    networks:
      - miproyecto
    depends_on:
      postgresql:
        condition: service_healthy

  sequin-redis:
    image: docker.io/library/redis:latest
    pull_policy: always
    container_name: miproyecto-redis
    hostname: miproyecto-redis
    restart: unless-stopped
    ports:
      - "33334:6379"
    command: ["redis-server", "--port", "6379"]
    volumes:
      - sequin_redis_data:/data
    networks:
      - miproyecto

  sequin:
    image: docker.io/sequin/sequin:latest
    pull_policy: always
    container_name: miproyecto-sequin
    hostname: miproyecto-sequin
    restart: unless-stopped
    environment:
      - PG_HOSTNAME=miproyecto-postgresql
      - PG_DATABASE=app
      - PG_PORT=33330
      - PG_USERNAME=duck
      - PG_PASSWORD=quack
      - PG_POOL_SIZE=20
      # Un-comment for SSL
      # - PG_SSL=true
      - SECRET_KEY_BASE=wDPLYus0pvD6qJhKJICO4dauYPXfO/Yl782Zjtpew5qRBDp7CZvbWtQmY0eB13If
      - VAULT_KEY=2Sig69bIpuSm2kv0VQfDekET2qy8qUZGI8v3/h3ASiY=
      - CONFIG_FILE_PATH=/config/sequin.yml
    ports:
      - "33333:7376"
    volumes:
      - ./sequin/sequin.yml:/config/sequin.yml
    networks:
      - miproyecto
    depends_on:
      postgresql:
        condition: service_healthy
      sequin-redis:
        condition: service_started

volumes:
  pgdata:
  pgadmin_data:
  sequin_redis_data:

networks:
  miproyecto:
    driver: bridge
