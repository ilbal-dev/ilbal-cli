name: ${PROJECT_NAME}

services:
  postgresql:
    image: ${IMAGE_POSTGRES}
    pull_policy: missing
    container_name: ${PROJECT_NAME}-postgresql
    hostname: ${PROJECT_NAME}-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    command: ["postgres", "-c", "config_file=/postgres/postgresql.conf"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/postgres/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/postgres/pg_hba.conf:ro
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ${PROJECT_NAME}_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 2s
      retries: 10
      start_period: 30s
      start_interval: 1s

  pgadmin4:
    image: ${IMAGE_PGADMIN}
    pull_policy: missing
    container_name: ${PROJECT_NAME}-pgadmin4
    hostname: ${PROJECT_NAME}-pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin4/servers.json:/pgadmin4/servers.json
      - ./pgadmin4/pgpass:/pgadmin4/pgpass
    networks:
      - ${PROJECT_NAME}_network
    depends_on:
      postgresql:
        condition: service_healthy

  pgdog:
    image: ${IMAGE_PGDOG}
    pull_policy: missing
    container_name: ${PROJECT_NAME}-pgdog
    hostname: ${PROJECT_NAME}-pgdog
    restart: unless-stopped
    ports:
      - "${PGDOG_PORT}:6432"
    volumes:
      - ./pgdog/pgdog.toml:/pgdog/pgdog.toml
      - ./pgdog/users.toml:/pgdog/users.toml
    networks:
      - ${PROJECT_NAME}_network
    depends_on:
      postgresql:
        condition: service_healthy

  martin:
    image: ${IMAGE_MARTIN}
    pull_policy: missing
    container_name: ${PROJECT_NAME}-martin
    hostname: ${PROJECT_NAME}-martin
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://authenticator:${POSTGRES_PASSWORD}@pgdog:6432/${POSTGRES_DB}?options=-c%20role%3Dwebuser
    ports:
      - "${MARTIN_PORT}:3000"
    networks:
      - ${PROJECT_NAME}_network
    depends_on:
      pgdog:
        condition: service_started

  sequin-redis:
    image: ${IMAGE_REDIS}
    pull_policy: missing # could be `always`, too
    container_name: ${PROJECT_NAME}-redis
    hostname: ${PROJECT_NAME}-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    command: ["redis-server", "--port", "6379"]
    volumes:
      - sequin_redis_data:/data
    networks:
      - ${PROJECT_NAME}_network

  sequin:
    image: ${IMAGE_SEQUIN}
    pull_policy: missing # could be `always`, too
    container_name: ${PROJECT_NAME}-sequin
    hostname: ${PROJECT_NAME}-sequin
    restart: unless-stopped
    environment:
      - PG_HOSTNAME=${PROJECT_NAME}-postgresql
      - PG_DATABASE=${POSTGRES_DB}
      - PG_PORT=5432
      - PG_USERNAME=${POSTGRES_USER}
      - PG_PASSWORD=${POSTGRES_PASSWORD}
      - PG_POOL_SIZE=20
      # Un-comment for SSL
      # - PG_SSL=true
      - SECRET_KEY_BASE=wDPLYus0pvD6qJhKJICO4dauYPXfO/Yl782Zjtpew5qRBDp7CZvbWtQmY0eB13If
      - VAULT_KEY=2Sig69bIpuSm2kv0VQfDekET2qy8qUZGI8v3/h3ASiY=
      - REDIS_URL=redis://${PROJECT_NAME}-redis:6379
      - CONFIG_FILE_PATH=/config/sequin.yml
    ports:
      - "${SEQUIN_PORT}:7376"
    volumes:
      - ./sequin/sequin.yml:/config/sequin.yml
    networks:
      - ${PROJECT_NAME}_network
    depends_on:
      postgresql:
        condition: service_healthy
      sequin-redis:
        condition: service_started

volumes:
  pgdata:
  pgadmin_data:
  sequin_redis_data:

networks:
  ${PROJECT_NAME}_network:
    name: ${PROJECT_NAME}
    driver: bridge
