name: example

services:
  postgresql:
    image: docker.io/ilbal/ilbal-postgresql:latest
    pull_policy: missing
    container_name: example-postgresql
    hostname: example-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: duck
      POSTGRES_PASSWORD: quack123
      POSTGRES_DB: app
    ports:
      - "33330:5432"
    command: ["postgres", "-c", "config_file=/postgres/postgresql.conf"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/postgres/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/postgres/pg_hba.conf:ro
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ../data:/data
    networks:
      - example_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duck -d app"]
      interval: 10s
      timeout: 2s
      retries: 10
      start_period: 30s
      start_interval: 1s

  pgadmin4:
    image: docker.io/dpage/pgadmin4:latest
    pull_policy: missing
    container_name: example-pgadmin4
    hostname: example-pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: duck@duck.com
      PGADMIN_DEFAULT_PASSWORD: quack123
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_SESSION_COOKIE_NAME: "'example-pga4-session'"
    ports:
      - "33331:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin4/servers.json:/pgadmin4/servers.json
      - ./pgadmin4/pgpass:/pgadmin4/pgpass
    networks:
      - example_network
    depends_on:
      postgresql:
        condition: service_healthy

  martin:
    image: ghcr.io/maplibre/martin:latest
    pull_policy: missing
    container_name: example-martin
    hostname: example-martin
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://authenticator:quack123@postgresql:5432/app?options=-c%20role%3Dwebuser
    command:
      - --webui
      - enable-for-all
    ports:
      - "33332:3000"
    networks:
      - example_network

  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:latest
    pull_policy: missing
    container_name: example-seaweedfs
    hostname: example-seaweedfs
    restart: unless-stopped
    ports:
      - "33333:8333"
      - "33334:9333"
      - "33335:9340"
      - "33336:8888"
      - "33337:7333"
      - "33338:23646"
    volumes:
      - seaweedfs_data:/data
    networks:
      - example_network

volumes:
  pgdata:
  pgadmin_data:
  seaweedfs_data:

networks:
  example_network:
    name: example
    driver: bridge