apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f /tmp/tmp.w8yNVkVnVz -c -o /home/chikaj/Projects/ilbal.dev/ilbal-cli/ilbal/oci/kube/helm
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: pgadmin4
  name: pgadmin4
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: pgadmin4
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f /tmp/tmp.w8yNVkVnVz -c -o /home/chikaj/Projects/ilbal.dev/ilbal-cli/ilbal/oci/kube/helm
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: pgadmin4
    spec:
      containers:
        - env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: admin@ilbal.dev
            - name: PGADMIN_DEFAULT_PASSWORD
              value: admin
          image: dpage/pgadmin4:latest
          name: my-project-pgadmin4
          ports:
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/pgadmin
              name: pgadmin-data
            - mountPath: /pgadmin4/servers.json
              name: pgadmin4-claim1
            - mountPath: /pgadmin4/pgpass
              name: pgadmin4-claim2
      hostname: my-project-pgadmin4
      restartPolicy: Always
      volumes:
        - name: pgadmin-data
          persistentVolumeClaim:
            claimName: pgadmin-data
        - name: pgadmin4-claim1
          persistentVolumeClaim:
            claimName: pgadmin4-claim1
        - name: pgadmin4-claim2
          persistentVolumeClaim:
            claimName: pgadmin4-claim2
