services:
  postgresql:
    image: ilbal-postgresql:18
    pull_policy: missing
    container_name: ${PROJECT_NAME}-postgresql
    hostname: ${PROJECT_NAME}-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    command: ["postgres", "-c", "config_file=/pgconfig/postgresql.conf"]
    volumes:
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
      - ./pgconfig/postgresql.conf:/pgconfig/postgresql.conf:ro
    networks:
      - ${PROJECT_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sequin"]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 2s
      start_interval: 1s

  pgadmin4:
    image: docker.io/dpage/pgadmin4:latest
    pull_policy: missing
    container_name: ${PROJECT_NAME}-pgadmin4
    hostname: ${PROJECT_NAME}-pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json
      - ./pgpass:/pgadmin4/pgpass
    networks:
      - ${PROJECT_NAME}
    depends_on:
      postgresql:
        condition: service_healthy

  pgdog:
    image: ghcr.io/pgdogdev/pgdog:latest
    pull_policy: missing
    container_name: ${PROJECT_NAME}-pgdog
    hostname: ${PROJECT_NAME}-pgdog
    restart: unless-stopped
    ports:
      - "${PGDOG_PORT}:6432"
    networks:
      - ${PROJECT_NAME}
    depends_on:
      postgresql:
        condition: service_healthy

  sequin-redis:
    image: docker.io/library/redis:latest
    pull_policy: always
    container_name: ${PROJECT_NAME}-redis
    hostname: ${PROJECT_NAME}-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    command: ["redis-server", "--port", "6379"]
    volumes:
      - sequin_redis_data:/data
    networks:
      - ${PROJECT_NAME}

  sequin:
    image: docker.io/sequin/sequin:latest
    pull_policy: always
    container_name: ${PROJECT_NAME}-sequin
    hostname: ${PROJECT_NAME}-sequin
    restart: unless-stopped
    environment:
      - PG_HOSTNAME=${PROJECT_NAME}-postgresql
      - PG_DATABASE=${POSTGRES_DB}
      - PG_PORT=${POSTGRES_PORT}
      - PG_USERNAME=${POSTGRES_USER}
      - PG_PASSWORD=${POSTGRES_PASSWORD}
      - PG_POOL_SIZE=20
      # Un-comment for SSL
      # - PG_SSL=true
      - SECRET_KEY_BASE=wDPLYus0pvD6qJhKJICO4dauYPXfO/Yl782Zjtpew5qRBDp7CZvbWtQmY0eB13If
      - VAULT_KEY=2Sig69bIpuSm2kv0VQfDekET2qy8qUZGI8v3/h3ASiY=
      - CONFIG_FILE_PATH=/config/sequin.yml
    ports:
      - "${SEQUIN_PORT}:7376"
    volumes:
      - ./sequin.yml:/config/sequin.yml
    networks:
      - ${PROJECT_NAME}
    depends_on:
      postgresql:
        condition: service_healthy
      sequin-redis:
        condition: service_started

volumes:
  pgdata:
  pgadmin_data:
  sequin_redis_data:

networks:
  ${PROJECT_NAME}:
    driver: bridge
